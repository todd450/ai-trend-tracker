# Refreshes the data every day and commits it. If the site is deployed from
# this repository (for example on Vercel), each commit triggers a rebuild.
#
# GitHub's terms allow hosted runners only for work that builds or publishes the
# repository's own project, and not as a server. This job fits because it runs
# once a day and only produces this site's data. Keep it that way: do not trigger
# it on demand from outside, serve anything from the runner, or collect data for
# another project here.
name: Collect data

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect
        run: node scripts/collect.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Any OpenRouter account key; the model share figures are skipped without it.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update trend data"
          git push
